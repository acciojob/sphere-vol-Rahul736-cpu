<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Volume of a Sphere</title>

    <script src="script.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }
        label {
            display: block;
            margin-top: 15px;
        }
        input {
            margin-top: 5px;
            padding: 5px;
            width: 200px;
        }
        button {
            margin-top: 15px;
            padding: 7px 15px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h3>Input radius value and get the volume of a sphere.</h3>

    <!-- Radius Input -->
    <label for="radius">Radius</label>
    <input type="text" id="radius">

    <!-- Output Volume -->
    <label for="volume">Volume</label>
    <input type="text" id="volume" readonly>

    <!-- Button -->
    <button onclick="volume_sphere()">Calculate</button>

</body>
</html>
