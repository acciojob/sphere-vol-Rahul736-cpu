<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Volume of a Sphere</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; }
    label { display: block; margin-top: 12px; }
    input { margin-top: 6px; padding: 6px; width: 220px; }
    button { margin-top: 12px; padding: 7px 14px; }
  </style>
</head>
<body>
  <h3>Input radius value and get the volume of a sphere.</h3>

  <label for="radius">Radius</label>
  <input id="radius" type="text" placeholder="enter radius">

  <label for="volume">Volume</label>
  <input id="volume" type="text" readonly>

  <button id="calcBtn">Calculate</button>

  <script src="script.js"></script>
</body>
</html>
