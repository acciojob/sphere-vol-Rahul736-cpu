<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Asian Paints Grid</title>

<style>
  #grid-container {
    display: grid;
    grid-template-columns: repeat(3, 100px);
    gap: 10px;
    margin-bottom: 20px;
  }

  .grid-item {
    width: 100px;
    height: 100px;
    border: 2px solid black;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 30px;
    background-color: transparent;
  }
</style>

</head>
<body>

<h2>Asian Paints Color Application</h2>

<div id="grid-container">
  <div class="grid-item" id="1">1</div>
  <div class="grid-item" id="2">2</div>
  <div class="grid-item" id="3">3</div>
  <div class="grid-item" id="4">4</div>
  <div class="grid-item" id="5">5</div>
  <div class="grid-item" id="6">6</div>
  <div class="grid-item" id="7">7</div>
  <div class="grid-item" id="8">8</div>
  <div class="grid-item" id="9">9</div>
</div>

<label for="block_id">Block ID:</label>
<input type="text" id="block_id">

<label for="colour_id">Color:</label>
<input type="text" id="colour_id">

<br><br>

<button id="change_button">Change Color</button>
<button id="Reset">Reset</button>

<script>
  const changeBtn = document.getElementById("change_button");
  const resetBtn = document.getElementById("Reset");

  // Reset all blocks
  function resetColors() {
    const blocks = document.querySelectorAll(".grid-item");
    blocks.forEach(block => block.style.backgroundColor = "transparent");
  }

  // Change color logic
  changeBtn.addEventListener("click", function () {
    const blockId = document.getElementById("block_id").value;
    const color = document.getElementById("colour_id").value;

    resetColors(); // First reset all

    const selectedBlock = document.getElementById(blockId);

    if (selectedBlock) {
      selectedBlock.style.backgroundColor = color;
    }
  });

  // Reset button
  resetBtn.addEventListener("click", resetColors);
</script>

</body>
</html>
